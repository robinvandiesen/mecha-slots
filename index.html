<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mecha Slots</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070b;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage {
        position: relative;
      }
      canvas {
        position: absolute;
        display: block;
        touch-action: none;
      }
      #game {
        left: 0;
        top: 0;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <!-- The 3D battlefield sits underneath the 2D canvas, which draws the UI. -->
      <canvas id="world"></canvas>
      <canvas id="game"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
